[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paxplot"
version = "0.2.0"
description = "PaxPlot stores and renders serializable parallel coordinate plots."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jacob Kravits", email = "kravitsjacob@gmail.com" }
]
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.2.3",
    "pydantic>=2.7"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/kravitsjacob/paxplot"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.6",
    "setuptools>=77",
    "sphinx>=8",
    "syrupy>=4.7"
]
docs = [
    "pydata-sphinx-theme",
    "sphinx>=8",
    "sphinx-sitemap"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"paxplot" = ["data/tradeoff.csv", "data/hydroclimate_model_evaluation.csv"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: marks end-to-end plotting workflows"]
